<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

#titulo{
position:absolute;
top:20px;
width:100%;
text-align:center;
color:white;
font-size:30px;
z-index:100;
}

model-viewer{
width:100vw;
height:100vh;
}

</style>

</head>

<body>

<div id="titulo">
Cargando...
</div>

<model-viewer
id="visor"
camera-controls
auto-rotate>
</model-viewer>

<audio id="sonido"></audio>

<script>

const animal=
new URLSearchParams(
window.location.search
).get("animal")||"gorila";


const datos={

gorila:{
nombre:"GORILA ALFA",
modelo:"modelos/Gorila1.glb",
sonido:"sonidos/rugido-gorila.mp3"
}

};


document.getElementById(
"titulo").innerText=
datos[animal].nombre;


document.getElementById(
"visor").src=
datos[animal].modelo;


document.getElementById(
"sonido").src=
datos[animal].sonido;


window.addEventListener(
"click",()=>{

document.getElementById(
"sonido").play();

if(navigator.vibrate){

navigator.vibrate(
[300,100,300]);

}

},{once:true});

</script>

</body>
</html>
