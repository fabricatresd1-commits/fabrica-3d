<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

#titulo{
position:absolute;
top:30px;
width:100%;
text-align:center;
color:white;
font-size:40px;
z-index:100;
font-weight:bold;
}

model-viewer{
width:100vw;
height:100vh;
display:block;
}

</style>

</head>

<body>

<div id="titulo">
Cargando...
</div>

<model-viewer
id="visor"
camera-controls
auto-rotate
autoplay
shadow-intensity="1"
camera-orbit="0deg 75deg 2m"
min-camera-orbit="auto auto 1m"
max-camera-orbit="auto auto 5m"
style="width:100%;height:100%;">
</model-viewer>

<audio id="sonido"></audio>

<script>

const animal=
new URLSearchParams(
window.location.search
).get("animal")||"gorila";


const datos={

gorila:{
nombre:"FABRICA 3D GORILA",
modelo:"MODELOS/Gorila1.glb",
sonido:"SONIDOS/rugido-gorila.mp3"
},

leon:{
nombre:"FABRICA 3D LEÓN",
modelo:"MODELOS/LEON1.glb",
sonido:"SONIDOS/rugido-leon.mp3"
}

};


document.getElementById(
"titulo").innerText=
datos[animal].nombre;


document.getElementById(
"visor").src=
datos[animal].modelo;


document.getElementById(
"sonido").src=
datos[animal].sonido;


window.addEventListener(
"click",()=>{

document.getElementById(
"sonido").play();

if(navigator.vibrate){

navigator.vibrate(
[300,100,300]);

}

},{once:true});

</script>

</body>

</html>
