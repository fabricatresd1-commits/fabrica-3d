<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Fábrica 3D</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

#pantallaCarga{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:black;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

color:white;

z-index:999;

transition:1.5s;

}

#intro{

position:absolute;

top:8%;

width:100%;

text-align:center;

z-index:100;

transition:1.5s;

}

#titulo{

color:white;

font-size:48px;

font-weight:bold;

text-shadow:
0 0 25px gold;

}

#subtitulo{

margin-top:10px;

color:gold;

font-size:18px;

letter-spacing:4px;

}

video{

width:100vw;

height:100vh;

object-fit:contain;

background:black;

opacity:0;

transition:2s;

}

#sonido{

position:absolute;

bottom:30px;

right:20px;

z-index:100;

background:black;

color:white;

border:1px solid gold;

padding:12px;

border-radius:15px;

font-size:18px;

}

#facebook{

position:absolute;

bottom:30px;

left:20px;

z-index:100;

background:#1877F2;

color:white;

padding:12px;

border-radius:15px;

text-decoration:none;

font-size:18px;

font-weight:bold;

}

</style>

</head>

<body>

<div id="pantallaCarga">

<h2>
Preparando experiencia...
</h2>

</div>

<div id="intro">

<div id="titulo">
FÁBRICA 3D
</div>

<div id="subtitulo">
Escanea • Explora • Aprende
</div>

</div>

<video
id="video"
autoplay
muted
loop
playsinline>
</video>

<audio id="audio"></audio>

<button id="sonido">

🔊 SONIDO

</button>

<a
href="https://www.facebook.com/share/18zfqqkPHV/"
target="_blank"
id="facebook">

👍 FACEBOOK

</a>

<script src="script.js"></script>

</body>

</html>
